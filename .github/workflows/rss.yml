name: Daily RSS Update

on:
  schedule:
    - cron: "47 3 * * *"  # 06:47 EEST (03:47 UTC) — backup; kyrio trigger apo launchd sto Mac stis 07:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: node generate.js
      - run: |
          git config user.name "rss-bot"
          git config user.email "bot@github.com"
          git add rss.xml
          git commit -m "Daily RSS update" || echo "No changes"
          git push
